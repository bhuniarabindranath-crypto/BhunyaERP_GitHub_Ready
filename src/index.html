<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhunya ERP</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#687386;--primary:#2563eb;--line:#e5e9f0;--danger:#dc2626;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:18px;position:fixed;top:0;bottom:0}.brand{font-size:23px;font-weight:800;margin:5px 8px 24px}.brand small{display:block;color:#9ca3af;font-size:11px;font-weight:500;margin-top:4px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#cbd5e1;padding:12px 13px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:25px}.pill{background:#e8eefc;color:#1d4ed8;padding:7px 11px;border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px #00000008}.metric{font-size:27px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,input,select,textarea{border:1px solid #d8dee8;border-radius:9px;padding:9px 11px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;background:#e8edf5;color:#243042}.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:#64748b;background:#f8fafc}.badge{padding:4px 8px;border-radius:99px;font-size:11px;background:#eef2ff;color:#3730a3}.badge.low{background:#fee2e2;color:#991b1b}.section{display:none}.section.active{display:block}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;width:min(760px,96vw);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}.formrow{display:flex;flex-direction:column;gap:6px}.invoice{max-width:900px;margin:auto;background:#fff;padding:28px;border:1px solid var(--line)}.right{text-align:right}.total{font-size:21px;font-weight:800}.empty{text-align:center;padding:40px;color:#8792a3}.lang{font-size:12px;color:#9ca3af;margin:20px 8px}.search{min-width:240px}@media(max-width:900px){.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">BHUNYA ERP<small>Offline Business Manager</small></div><div class="nav" id="nav"></div><div class="lang">বাংলা + English</div></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div><span class="pill" id="shopPill">My Business</span></div></div><div id="sections"></div></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><script src="app.js"></script></body></html>
